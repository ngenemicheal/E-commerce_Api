name: CD — Deploy to AWS EC2 (SSH pull)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      note:
        description: "Reason for manual deploy"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: SSH into EC2 + docker compose pull + up
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Run deploy script via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /home/ubuntu
            echo ">> $(date -Iseconds) Deploy triggered by SHA ${GITHUB_SHA:0:7} / ${GITHUB_REF_NAME:-manual}"
            # If your GHCR image is PRIVATE, UNCOMMENT the next 2 lines and add GH_PAT_READ_PACKAGES secret:
            # echo "${{ secrets.GH_PAT_READ_PACKAGES }}" | docker login ghcr.io \
            #   -u ngenemicheal --password-stdin
            echo ">> Pulling latest image"
            docker compose pull
            echo ">> Recreate containers with new image"
            docker compose up -d --remove-orphans
            echo ">> Cleanup old images"
            docker image prune -af 2>/dev/null || true
            sleep 20
            echo ">> Container status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ">> Last 50 logs from ecommerce-api:"
            docker logs --tail 50 ecommerce-api 2>&1 | tail -50
            echo ">> Wait for container health"
            for i in 1 2 3 4 5 6; do
              if curl -sf http://127.0.0.1:8080/api/categories > /dev/null; then
                echo "   ✅ Attempt $i /health 200 OK from EC2 localhost"
                break
              else
                echo "   ⏳ Attempt $i / waiting 10s"
                sleep 10
              fi
            done