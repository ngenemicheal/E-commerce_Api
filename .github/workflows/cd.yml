name: CD — Deploy to AWS EC2 (SSH pull)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      note:
        description: "Reason for manual deploy"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: SSH into EC2 + docker compose pull + up
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Run deploy script via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          # ---- 🌟 NEW: FORWARD RUNNER VARIABLES INTO REMOTE SHELL AS EXPLICIT ENVS ----
          envs: GITHUB_SHA,GITHUB_REF_NAME,GH_PAT_READ_PACKAGES,GH_USERNAME
          envs_format: auto
          script: |
            # ---- NO MORE -u. Keep -e -o pipefail, allow unset refs ----
            set -eo pipefail
            cd /home/ubuntu

            # ---- SAFE FALLBACK DEFAULTS (even if envs were stripped) ----
            SHA_SHORT="${GITHUB_SHA:-0000000}"
            SHA_SHORT="${SHA_SHORT:0:7}"
            REF="${GITHUB_REF_NAME:-manual-dispatch}"
            echo ">> $(date -Iseconds) Deploy triggered by SHA $SHA_SHORT / $REF"

            # ---- GHCR IMAGE IS PRIVATE → ALWAYS LOGIN FIRST, PAT NEVER IN LOGS ----
            echo ">> Logging into GHCR as github user (PAT masked by appleboy envs_format auto)"
            GH_USERNAME="ngenemicheal"
            if [ -n "${GH_PAT_READ_PACKAGES:-}" ]; then
              echo "${GH_PAT_READ_PACKAGES}" | docker login ghcr.io -u "$GH_USERNAME" --password-stdin 2>&1 \
                | sed -e 's/.*/*** (login result suppressed to keep PAT safe)/'
            else
              echo "⚠️  WARNING: GH_PAT_READ_PACKAGES secret empty / missing. docker pull may fail on private repos."
            fi

            echo ">> Pulling latest image from ghcr.io/$GH_USERNAME/e-commerce_api:latest"
            docker compose pull

            echo ">> Recreate containers with new image"
            docker compose up -d --remove-orphans

            echo ">> Cleanup old images"
            docker image prune -af 2>/dev/null || true

            echo ">> Waiting 25s for ASP.NET boot + migrations + EF seeding..."
            sleep 25

            echo ">> Container status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ">> Last 60 logs from ecommerce-api:"
            docker logs --tail 60 ecommerce-api 2>&1 | tail -60

            echo ">> Wait for container health endpoint /api/categories (max 90 s):"
            for i in 1 2 3 4 5 6 7 8 9; do
              if curl -sf http://127.0.0.1:8080/api/categories > /dev/null; then
                echo "   ✅ Attempt $i — /api/categories 200 OK from EC2 localhost. DEPLOY SUCCESS 🎉"
                exit 0
              fi
              echo "   ⏳ Attempt $i — waiting 10s"
              sleep 10
            done
            echo "   ❌ 9 attempts over 90s — API never came up. CHECK docker logs above for exception stack trace."
            exit 1